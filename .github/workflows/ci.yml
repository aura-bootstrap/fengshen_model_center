name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: use long temp path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\mc-temp | Out-Null
          "TEMP=C:\mc-temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=C:\mc-temp" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  guard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: no fengshen-slicer imports
        shell: bash
        run: |
          if git grep -n "fengshen-slicer/" -- '*.go'; then
            echo "Go sources must not import fengshen-slicer packages"
            exit 1
          fi
      - name: no weight or binary extensions
        shell: bash
        run: |
          bad=$(git ls-files | grep -Ei '\.(exe|dll|gguf|ggml|th|pth|pt|safetensors|bin)$' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden artifacts tracked:"
            echo "$bad"
            exit 1
          fi
      - name: no files above 100 MiB
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            s=$(wc -c < "$f")
            if [ "$s" -gt 104857600 ]; then
              echo "Oversized file: $f ($s bytes)"
              failed=1
            fi
          done < <(git ls-files -z)
          exit $failed
